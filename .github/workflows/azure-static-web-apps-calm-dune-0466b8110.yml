name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  quality_gates:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend install and build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Frontend unit tests
        working-directory: src/frontend
        run: npm run test
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Frontend ESLint
        working-directory: src/frontend
        continue-on-error: true
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: API dependencies and import smoke
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      - name: Import function_app
        working-directory: api
        run: python -c "import function_app; print('function_app import ok')"

      - name: Python lint (Ruff)
        run: |
          pip install ruff
          ruff check api/ --ignore E501,F401 || true

  build_and_deploy_job:
    needs: [quality_gates]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # SWA upload/poll can exceed the action’s ~10m internal window; allow the job to finish retries.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # Build here (with Vite env) so Oryx only packages `dist` + builds the API — shorter than a full Oryx frontend build.
      - name: Frontend production build (for SWA skip_app_build)
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Verify paths for SWA (Oryx validates these inside /github/workspace)
        run: |
          set -e
          test -d src/frontend
          test -d src/frontend/dist
          test -d api
          ls -la src/frontend | head -20

      # Do not wrap in Wandalen/wretry: it invokes Wandalen/static-web-apps-deploy and breaks app_location (repo not mounted as expected).
      - name: Deploy to Azure Static Web Apps
        id: swa_deploy_1
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_0466B8110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          api_location: api
          output_location: dist
          skip_app_build: true
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Deploy to Azure Static Web Apps (retry after upload timeout)
        id: swa_deploy_2
        if: steps.swa_deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_0466B8110 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          api_location: api
          output_location: dist
          skip_app_build: true
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Require deploy success
        if: always()
        run: |
          o1="${{ steps.swa_deploy_1.outcome }}"
          o2="${{ steps.swa_deploy_2.outcome }}"
          if [ "$o1" = "success" ] || [ "$o2" = "success" ]; then
            echo "Deploy succeeded (attempt 1: $o1, attempt 2: $o2)"
            exit 0
          fi
          echo "Deploy failed after retries (attempt 1: $o1, attempt 2: $o2)"
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_0466B8110 }}
          action: "close"
