name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  quality_gates:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend install and build
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Frontend unit tests
        working-directory: src/frontend
        run: npm run test
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Frontend ESLint
        working-directory: src/frontend
        continue-on-error: true
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: API dependencies and import smoke
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      - name: Import function_app
        working-directory: api
        run: python -c "import function_app; print('function_app import ok')"

      - name: Python lint (Ruff)
        run: |
          pip install ruff
          ruff check api/ --ignore E501,F401 || true

  build_and_deploy_job:
    needs: [quality_gates]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # SWA upload/poll can exceed the action’s ~10m internal window; allow the job to finish retries.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # Build here (with Vite env) so Oryx only packages `dist` + builds the API — shorter, stabler deploy than full Oryx frontend build.
      - name: Frontend production build (for SWA skip_app_build)
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Azure SWA often fails with "Upload Timed Out" after ~600s polling; retry is the practical mitigation (see Azure/static-web-apps#942).
      - name: Build And Deploy
        id: builddeploy
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 60000
          action: Azure/static-web-apps-deploy@v1
          with: |
            azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_0466B8110 }}
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            action: upload
            app_location: src/frontend
            api_location: api
            output_location: dist
            skip_app_build: true
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_0466B8110 }}
          action: "close"
